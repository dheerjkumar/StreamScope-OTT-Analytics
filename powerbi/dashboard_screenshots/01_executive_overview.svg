    <rect x="0" y="30" width="12" height="12" fill="#818cf8" rx="2"/>
    <text x="20" y="41" fill="#f8fafc">Basic with Ads (24.3%)</text>
    <rect x="0" y="60" width="12" height="12" fill="#34d399" rx="2"/>
